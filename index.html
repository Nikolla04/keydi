<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Za tebe 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
<style>
:root{--fg:#fce4ec;--glow:rgba(255,105,180,.65);--dim:rgba(255,182,193,.5);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%}
body{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#3b1239 0%,#1a0b1c 48%,#06020a 100%);font-family:Georgia,serif;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#ttl{position:absolute;top:7%;left:0;right:0;text-align:center;z-index:2;color:var(--fg);font:italic 500 1.05rem 'Cormorant Garamond',Georgia,serif;letter-spacing:.45em;text-transform:uppercase;text-shadow:0 0 14px var(--glow);opacity:0;animation:fade 3s 1s forwards}
#msg{position:absolute;z-index:2;left:0;right:0;bottom:10%;padding:0 26px;text-align:center;color:var(--fg);font:500 clamp(1.5rem,5.2vw,2.3rem)/1.5 'Dancing Script',Georgia,cursive;white-space:pre-line;min-height:4.6em;text-shadow:0 0 16px var(--glow),0 0 40px rgba(255,64,129,.35)}
#msg.typing::after{content:'|';margin-left:2px;opacity:.7;animation:blink 1s steps(1) infinite}
#hint{position:absolute;z-index:2;bottom:16px;left:0;right:0;text-align:center;color:var(--dim);font:.85rem sans-serif;opacity:0;transition:opacity 2s}
#again{position:absolute;z-index:3;right:14px;bottom:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,182,193,.3);background:rgba(255,255,255,.06);color:var(--dim);font-size:1.1rem;cursor:pointer;backdrop-filter:blur(4px)}
@keyframes fade{to{opacity:.85}}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ttl">Za tebe</div>
<div id="msg"></div>
<div id="hint">Dodirni ekran za još latica ✨</div>
<button id="again" aria-label="Ponovo">↻</button>
<script>
// ✏️ OVDE MENJAŠ TEKST (\n je novi red) I NASLOV:
const CFG={title:'Za tebe',message:'Neki ljudi uđu u život tiho,\na ulepšaju ga zauvek.\nHvala ti što postojiš Keydi. ❤️'};
document.getElementById('ttl').textContent=CFG.title;

const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg'),hint=document.getElementById('hint');
const DPR=Math.min(window.devicePixelRatio||1,2);
let W,H,S,cx,gy,ty,time=0;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo3=t=>1-Math.pow(1-t,3);
const eob=t=>{t=clamp(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const rnd=(a,b)=>a+Math.random()*(b-a);

let stars=[],flies=[],blades=[],stamens=[];
function resize(){
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W/400,H/760,1.6);cx=W/2;gy=H*.76;ty=H*.40;
  stars=Array.from({length:Math.round(W*H/5500)},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:rnd(.4,1.5),ph:rnd(0,6.3),sp:rnd(.8,2.5)}));
  flies=Array.from({length:22},()=>({bx:Math.random()*W,by:rnd(H*.25,H*.9),ph:rnd(0,6.3),sp:rnd(.5,1.2),r:rnd(1.2,2.4)}));
  blades=Array.from({length:46},()=>({dx:rnd(-110,110),h:rnd(14,38),l:rnd(-8,8),ph:rnd(0,6.3),c:Math.random()}));
}
stamens=Array.from({length:18},()=>({a:rnd(0,6.28),r:rnd(5,16)}));
addEventListener('resize',resize);resize();

/* ---------- čestice: latice, srca, iskre ---------- */
const parts=[];
class P{
  constructor(t,x,y,o={}){
    Object.assign(this,{t,x,y,vx:rnd(-.35,.35),vy:rnd(.4,1.1),g:0,dr:1,sz:rnd(4,8)*S,rot:rnd(0,6.28),vr:rnd(-.03,.03),life:1e9,age:0,ph:rnd(0,6.28),hue:rnd(330,355),op:rnd(.5,.9)},o);
  }
  update(dt){
    const k=dt*60;this.age+=dt;
    this.vy+=this.g*k;const d=Math.pow(this.dr,k);this.vx*=d;this.vy*=d;
    this.x+=(this.vx+(this.t==='petal'?Math.sin(time*2+this.ph)*.5:0))*k;this.y+=this.vy*k;this.rot+=this.vr*k;
    return this.age<this.life&&this.y<H+40;
  }
  draw(){
    const a=this.op*clamp((this.life-this.age)/.7);
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    if(this.t==='petal'){ctx.fillStyle=`hsla(${this.hue},85%,70%,${a})`;petalPath(this.sz*2.2,this.sz*.9);ctx.fill()}
    else if(this.t==='heart'){ctx.fillStyle=`hsla(345,90%,66%,${a})`;ctx.shadowColor='rgba(255,80,140,.8)';ctx.shadowBlur=10;const s=this.sz;ctx.beginPath();ctx.moveTo(0,s*.3);ctx.bezierCurveTo(-s,-s*.4,-s*.5,-s*1.1,0,-s*.5);ctx.bezierCurveTo(s*.5,-s*1.1,s,-s*.4,0,s*.3);ctx.fill()}
    else{ctx.fillStyle=`rgba(255,236,170,${a})`;ctx.shadowColor='#ffd54f';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,this.sz*.3,0,6.3);ctx.fill()}
    ctx.restore();
  }
}
for(let i=0;i<12;i++)parts.push(new P('petal',rnd(0,W),rnd(0,H)));

function burst(x,y){
  for(let i=0;i<8;i++)parts.push(new P('petal',x,y,{vx:rnd(-4,4),vy:rnd(-5,1),g:.05,dr:.975,op:.9}));
  for(let i=0;i<4;i++)parts.push(new P('heart',x,y,{vx:rnd(-2.5,2.5),vy:rnd(-4.5,-1.5),g:.03,dr:.98,sz:rnd(7,11)*S,vr:rnd(-.02,.02),rot:0,life:2.6,op:.95}));
  for(let i=0;i<8;i++)parts.push(new P('spark',x,y,{vx:rnd(-3,3),vy:rnd(-3,3),dr:.95,sz:rnd(5,9)*S,life:.9,op:1}));
}
let ac;
function chime(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=[523.25,587.33,659.25,783.99,880][Math.random()*5|0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);o.connect(g).connect(ac.destination);o.start();o.stop(t+1.6)}catch(e){}}
let down=false,lastTrail=0;
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=true;burst(e.clientX,e.clientY);chime()});
addEventListener('pointerup',()=>down=false);
addEventListener('pointermove',e=>{const n=performance.now();if((down||e.pointerType==='mouse')&&n-lastTrail>45){lastTrail=n;parts.push(new P('spark',e.clientX,e.clientY,{vx:rnd(-.4,.4),vy:rnd(-.4,.4),sz:rnd(5,8)*S,life:.7,op:.9}))}});

/* ---------- oblici ---------- */
function petalPath(l,w){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-w,-l*.35,-w*.85,-l*.95,0,-l);ctx.bezierCurveTo(w*.85,-l*.95,w,-l*.35,0,0)}

const st={stem:0,leaf:0,bloom:0,started:false,drop:0};
function stemPt(t){
  const sw=Math.sin(time*.8)*6*S*eo3(Math.min(st.stem,1));
  const x1=cx-50*S+sw*.4,y1=(gy+ty)/2,x2=cx+sw,u=1-t;
  return{x:u*u*cx+2*u*t*x1+t*t*x2,y:u*u*gy+2*u*t*y1+t*t*ty};
}

function drawMoon(){
  const x=W*.82,y=H*.15,r=22*S;
  ctx.save();ctx.fillStyle='#fff4d6';ctx.shadowColor='rgba(255,230,170,.9)';ctx.shadowBlur=35*S;
  ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.fill();
  ctx.shadowBlur=0;ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();ctx.arc(x+r*.55,y-r*.3,r*.9,0,6.3);ctx.fill();ctx.restore();
}
function drawStars(){
  for(const s of stars){ctx.fillStyle=`rgba(255,235,245,${.25+.55*(.5+.5*Math.sin(time*s.sp+s.ph))})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill()}
}
function drawFlies(){
  ctx.save();ctx.shadowColor='#ffe9a8';ctx.shadowBlur=14;
  for(const f of flies){
    const x=f.bx+Math.sin(time*.3*f.sp+f.ph)*60,y=f.by+Math.cos(time*.25*f.sp+f.ph*1.3)*40;
    ctx.fillStyle=`rgba(255,240,180,${.15+.8*(.5+.5*Math.sin(time*1.6*f.sp+f.ph))})`;
    ctx.beginPath();ctx.arc(x,y,f.r*S,0,6.3);ctx.fill();
  }
  ctx.restore();
}
function drawGround(grow){
  // meki sjaj i humka
  const g=ctx.createRadialGradient(cx,gy+6*S,2,cx,gy+6*S,150*S);
  g.addColorStop(0,'rgba(255,90,160,.22)');g.addColorStop(1,'rgba(255,90,160,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,gy+6*S,150*S,38*S,0,0,6.3);ctx.fill();
  const m=ctx.createRadialGradient(cx,gy,2,cx,gy+8*S,95*S);
  m.addColorStop(0,'#3a1d36');m.addColorStop(1,'#12060f');
  ctx.fillStyle=m;ctx.beginPath();ctx.ellipse(cx,gy+10*S,92*S*grow,18*S*grow,0,0,6.3);ctx.fill();
  ctx.lineCap='round';
  for(const b of blades){
    const h=b.h*S*grow,x=cx+b.dx*S*grow*(1-Math.abs(b.dx)/330),y=gy+8*S+Math.abs(b.dx)*.02*S;
    const sw=Math.sin(time*1.2+b.ph)*3*S;
    ctx.strokeStyle=b.c>.5?'#2e7d32':'#1b5e20';ctx.lineWidth=2*S;
    ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+b.l*S*.5,y-h*.55,x+b.l*S+sw,y-h);ctx.stroke();
  }
}
function drawStem(e){
  const n=Math.max(2,Math.floor(50*e));
  let prev=stemPt(0);
  ctx.save();ctx.lineCap='round';ctx.shadowColor='rgba(102,187,106,.35)';ctx.shadowBlur=10;
  const gr=ctx.createLinearGradient(0,gy,0,ty);gr.addColorStop(0,'#1b5e20');gr.addColorStop(1,'#4caf50');ctx.strokeStyle=gr;
  for(let i=1;i<=n;i++){
    const t=i/n*e,p=stemPt(t);
    ctx.lineWidth=(7-3*t)*S;ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();prev=p;
  }
  ctx.restore();
  return prev;
}
function drawLeaf(t,ang,k,len){
  if(k<=0)return;
  const p=stemPt(t);
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang+Math.sin(time*1.1+t*5)*.05);ctx.scale(k,k);
  const l=len*S,g=ctx.createLinearGradient(0,0,l,0);g.addColorStop(0,'#1b5e20');g.addColorStop(1,'#66bb6a');
  ctx.fillStyle=g;ctx.shadowColor='rgba(76,175,80,.3)';ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(l*.45,-l*.3,l,0);ctx.quadraticCurveTo(l*.45,l*.3,0,0);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(200,255,200,.25)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(l*.92,0);ctx.stroke();
  ctx.restore();
}
const LAYERS=[
  {n:9,l:80,w:34,off:0,c:['#6a0f3f','#d81b60','#f8bbd0']},
  {n:8,l:62,w:30,off:.35,c:['#880e4f','#ec407a','#f8bbd0']},
  {n:7,l:44,w:24,off:.2,c:['#ad1457','#f06292','#ffe0ec']},
  {n:5,l:26,w:16,off:.6,c:['#c2185b','#f48fb1','#ffffff']}
];
function drawFlower(x,y,b){
  if(b<=0)return;
  const e=eob(b);
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*.8)*.05);
  // halo
  const hr=160*S*clamp(e)*(1+Math.sin(time*1.6)*.06);
  const h=ctx.createRadialGradient(0,0,5,0,0,hr);h.addColorStop(0,'rgba(255,90,160,.35)');h.addColorStop(1,'rgba(255,90,160,0)');
  ctx.fillStyle=h;ctx.beginPath();ctx.arc(0,0,hr,0,6.3);ctx.fill();
  LAYERS.forEach((L,li)=>{
    const br=1+Math.sin(time*1.4+li)*.015;
    for(let i=0;i<L.n;i++){
      ctx.save();
      ctx.rotate(i*6.2832/L.n+L.off+(1-clamp(b))*.6*(li%2?-1:1)+Math.sin(time*1.2+i+li)*.025);
      const l=L.l*S*e*br,w=L.w*S*e;
      const g=ctx.createLinearGradient(0,0,0,-l);g.addColorStop(0,L.c[0]);g.addColorStop(.55,L.c[1]);g.addColorStop(1,L.c[2]);
      ctx.fillStyle=g;ctx.shadowColor='rgba(60,0,30,.45)';ctx.shadowBlur=10*S;
      petalPath(l,w);ctx.fill();
      ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(0,-l*.1);ctx.lineTo(0,-l*.8);ctx.stroke();
      ctx.restore();
    }
  });
  // središte
  const cr=12*S*clamp(e);
  const cg=ctx.createRadialGradient(0,0,1,0,0,cr);cg.addColorStop(0,'#fff9c4');cg.addColorStop(.6,'#fbc02d');cg.addColorStop(1,'#f57f17');
  ctx.fillStyle=cg;ctx.shadowColor='#ffd54f';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,cr,0,6.3);ctx.fill();
  ctx.fillStyle='#ffe082';ctx.shadowBlur=6;
  for(const s of stamens){ctx.beginPath();ctx.arc(Math.cos(s.a)*s.r*S*e,Math.sin(s.a)*s.r*S*e,1.7*S*clamp(e),0,6.3);ctx.fill()}
  ctx.restore();
}

/* ---------- poruka ---------- */
const M=Array.from(CFG.message);let run=0;
function type(){
  const id=++run;msg.textContent='';msg.classList.add('typing');let i=0;
  (function step(){
    if(id!==run)return;
    if(i<M.length){const c=M[i++];msg.textContent+=c;setTimeout(step,c==='\n'?650:/[.,!]/.test(c)?380:60)}
    else{msg.classList.remove('typing');hint.style.opacity=1}
  })();
}
document.getElementById('again').addEventListener('click',()=>{
  Object.assign(st,{stem:0,leaf:0,bloom:0,started:false,drop:0});run++;msg.textContent='';msg.classList.remove('typing');hint.style.opacity=0;
});

/* ---------- petlja ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
  ctx.clearRect(0,0,W,H);
  drawMoon();drawStars();drawFlies();

  st.stem=Math.min(1,st.stem+dt/3.4);
  if(st.stem>.45)st.leaf=Math.min(1,st.leaf+dt/1.6);
  if(st.stem>=1)st.bloom=Math.min(1,st.bloom+dt/3.2);

  drawGround(eo3(clamp(st.stem*3)));
  const e=1-Math.pow(1-st.stem,2);
  const top=drawStem(e);
  drawLeaf(.30,Math.PI+.55,eob(st.leaf*1.3),64);
  drawLeaf(.50,-.55,eob(st.leaf*1.3-.2),72);
  drawLeaf(.72,Math.PI+.7,eob(st.leaf*1.3-.3),46);
  drawFlower(top.x,top.y,st.bloom);

  if(st.bloom>=.85&&!st.started){st.started=true;type()}
  // latice koje cvet pušta
  if(st.bloom>=1&&time-st.drop>1.3){st.drop=time;parts.push(new P('petal',top.x+rnd(-30,30)*S,top.y+rnd(0,25)*S,{vx:rnd(-.5,.5),op:.9}))}
  if(Math.random()<.03&&parts.length<60)parts.push(new P('petal',rnd(0,W),-20));
  for(let i=parts.length-1;i>=0;i--){if(!parts[i].update(dt))parts.splice(i,1);else parts[i].draw()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
